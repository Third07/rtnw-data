<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Planner — Ragnarok Origin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #14110d;
    --bg-secondary: #1d1912;
    --bg-tertiary: #2a2418;
    --bg-elevated: #241f16;
    --border: #3d3624;
    --border-soft: #2c2818;
    --gold: #c9a227;
    --gold-bright: #e8c65a;
    --gold-dim: #7a6220;
    --teal: #4fa89d;
    --teal-dim: #2e5f59;
    --danger: #c0453a;
    --danger-dim: #6b2822;
    --text-primary: #ede6d3;
    --text-secondary: #b7ac8f;
    --text-muted: #7d735d;
    --font-display: 'Cinzel', serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 6px;
    --shadow-node: 0 2px 8px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-body);
    scroll-behavior: smooth;
  }
  body {
    background-image:
      radial-gradient(ellipse at top, rgba(201,162,39,.05), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
  }
  a { color: var(--gold); }
  img { max-width: 100%; display: block; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--gold-dim); color: var(--text-primary); }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  /* ---------- Site header ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 24px;
    background: linear-gradient(180deg, var(--bg-secondary), rgba(29,25,18,.94));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }
  .site-mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-bright);
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
  }
  .site-title {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: .04em;
    font-size: 18px;
    color: var(--text-primary);
  }
  .site-title small {
    display: block;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* ---------- Toolbar (desktop job select host) ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }
  .toolbar-label {
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600;
  }
  #skill-planner-job-host,
  #skill-planner-mobile-job-host { display: flex; align-items: center; }
  #skill-planner-mobile-job-host { padding: 12px 16px 0; }

  /* ---------- Custom job-select dropdown ---------- */
  #quick-job-select { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .job-select-shell { position: relative; min-width: 260px; }
  #quick-job-select-button {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 14px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 14px;
  }
  #quick-job-select-button:hover { border-color: var(--gold-dim); }
  .job-select-button-content { display: flex; align-items: center; gap: 10px; flex: 1; text-align: left; }
  .job-select-button-icon { width: 22px; height: 22px; border-radius: 4px; }
  .job-select-button-icon[hidden] { display: none; }
  .job-select-button-label { flex: 1; }
  #quick-job-select-button::after {
    content: "▾"; color: var(--gold); font-size: 11px; margin-left: auto;
  }
  #quick-job-select-popover {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 12px 28px rgba(0,0,0,.5);
    max-height: 340px; overflow-y: auto;
  }
  #quick-job-select-list { list-style: none; margin: 0; padding: 6px; }
  .job-select-option {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 4px;
    font-size: 13.5px; color: var(--text-secondary);
  }
  .job-select-option:hover, .job-select-option:focus { background: var(--bg-tertiary); color: var(--text-primary); }
  .job-select-option[aria-selected="true"] { color: var(--gold-bright); background: rgba(201,162,39,.08); }
  .job-select-option-icon { width: 20px; height: 20px; border-radius: 4px; }
  .job-select-option-icon[hidden] { display: none; }

  /* ---------- Layout ---------- */
  .simulator-layout {
    display: flex; align-items: flex-start; gap: 20px;
    max-width: 1400px; margin: 0 auto; padding: 20px 24px 80px;
  }
  #simulator-container { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  #skill-planner-sidebar {
    width: 340px; flex-shrink: 0;
    position: sticky; top: 96px;
    display: flex; flex-direction: column; gap: 16px;
    max-height: calc(100vh - 116px);
  }
  @media (max-width: 1371px) {
    .simulator-layout { flex-direction: column; }
    #skill-planner-sidebar { display: none; }
    .toolbar { display: none; }
  }
  @media (min-width: 1372px) {
    #skill-planner-mobile-job-host, #unique-skill-mobile-host { display: none !important; }
  }

  .loading-state {
    padding: 60px 20px; text-align: center;
    color: var(--text-muted); font-size: 14px; letter-spacing: .03em;
  }

  /* ---------- Job section ---------- */
  .job-section, .traits-section {
    background: var(--bg-secondary);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
  }
  .job-section.locked-preview, .traits-section.locked-preview { opacity: .45; filter: grayscale(.5); }
  .job-header-banner {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    background: linear-gradient(90deg, rgba(201,162,39,.1), transparent);
    border-bottom: 1px solid var(--border-soft);
  }
  .job-icon-large {
    width: 48px; height: 48px; border-radius: 8px;
    border: 1px solid var(--gold-dim);
    background: var(--bg-tertiary);
  }
  .job-info h2 {
    margin: 0 0 2px;
    font-family: var(--font-display);
    font-size: 18px; font-weight: 600;
    color: var(--text-primary);
  }
  .job-points { font-size: 12.5px; color: var(--text-muted); font-family: var(--font-mono); }
  .job-points .highlight { color: var(--gold-bright); font-weight: 600; }
  .job-points .text-danger { color: var(--danger) !important; }

  .job-skills-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    padding: 20px;
  }
  @media (max-width: 640px) {
    .job-skills-container { grid-template-columns: repeat(3, 1fr); }
  }

  /* ---------- Skill node ---------- */
  .skill-node { display: flex; justify-content: center; }
  .skill-node.empty { visibility: hidden; }
  .skill-outline-anchor {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 100%;
  }
  .skill-group-outline {
    position: absolute; z-index: 0;
    border: 1px dashed rgba(201,162,39,.35);
    border-radius: 12px;
    pointer-events: none;
  }
  .skill-icon-wrapper {
    position: relative;
    width: 58px; height: 58px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-tertiary);
    border: 2px solid var(--border);
    box-shadow: var(--shadow-node);
    transition: transform .12s ease, border-color .12s ease;
  }
  .skill-icon-wrapper:hover { transform: translateY(-2px); }
  .skill-icon-wrapper.locked { border-color: var(--border); filter: grayscale(.8) brightness(.55); }
  .skill-icon-wrapper.available { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(79,168,157,.18), var(--shadow-node); }
  .skill-icon-wrapper.active { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,.18), var(--shadow-node); }
  .skill-icon-wrapper.maxed { border-color: var(--gold-bright); box-shadow: 0 0 0 4px rgba(232,198,90,.28), var(--shadow-node); }
  .skill-icon { width: 40px; height: 40px; border-radius: 50%; }
  .skill-level {
    position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 10.5px; font-weight: 600;
    background: var(--bg-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 1px 6px;
    color: var(--text-secondary); white-space: nowrap;
  }
  .skill-level.over-natural { color: var(--danger); border-color: var(--danger-dim); }
  .skill-name {
    font-size: 11px; text-align: center; color: var(--text-secondary);
    max-width: 86px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .skill-controls { display: flex; gap: 4px; margin-top: 2px; }
  .skill-btn {
    width: 22px; height: 20px;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg-tertiary); color: var(--text-secondary);
    font-size: 12px; line-height: 1; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .skill-btn.add:not(:disabled):hover { border-color: var(--teal); color: var(--teal); }
  .skill-btn.add-max:not(:disabled):hover { border-color: var(--gold); color: var(--gold-bright); }
  .skill-btn.remove:not(:disabled):hover { border-color: var(--danger); color: var(--danger); }
  .skill-btn:disabled { opacity: .3; cursor: not-allowed; }

  .skill-tags-mini { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; max-width: 90px; }
  .skill-tag-mini {
    font-size: 8.5px; padding: 1px 4px; border-radius: 3px;
    background: color-mix(in srgb, var(--tag-color, var(--gold-dim)) 22%, var(--bg-tertiary));
    color: var(--tag-color, var(--text-secondary));
    border: 1px solid color-mix(in srgb, var(--tag-color, var(--gold-dim)) 45%, transparent);
  }

  /* ---------- Traits ---------- */
  .traits-section-header { padding: 14px 20px 0; }
  .traits-section-title {
    margin: 0 0 10px; font-family: var(--font-display);
    font-size: 14px; color: var(--gold-bright); text-transform: uppercase; letter-spacing: .08em;
  }
  .traits-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    padding: 0 20px 20px;
  }
  @media (max-width: 640px) { .traits-grid { grid-template-columns: repeat(3, 1fr); } }
  .trait-node .skill-icon-wrapper { border-radius: 10px; }
  .trait-node .skill-icon { border-radius: 8px; }

  /* ---------- Job choice (advancement) ---------- */
  .job-selection-container {
    background: var(--bg-secondary);
    border: 1px solid var(--gold-dim);
    border-radius: 10px;
    padding: 20px;
  }
  .job-selection-container h3 {
    margin: 0 0 16px;
    font-family: var(--font-display); font-size: 16px; color: var(--gold-bright);
  }
  .job-selection-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px;
  }
  .job-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 10px;
    text-align: center;
    transition: border-color .15s ease, transform .15s ease;
  }
  .job-card:hover { border-color: var(--gold); transform: translateY(-3px); cursor: pointer; }
  .job-card img { width: 52px; height: 52px; margin: 0 auto 8px; border-radius: 8px; }
  .job-card-name { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }

  /* ---------- Sidebar panels ---------- */
  .sidebar-panel {
    background: var(--bg-secondary);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
  }
  .sidebar-panel-title {
    font-family: var(--font-display); font-size: 13px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--gold-bright);
    padding: 12px 16px; border-bottom: 1px solid var(--border-soft);
    background: rgba(201,162,39,.05);
  }
  #skill-detail-content { padding: 16px; max-height: 46vh; overflow-y: auto; }
  .details-placeholder { color: var(--text-muted); font-size: 13px; padding: 8px 0; }

  #unique-skill-panel[hidden], #unique-skill-mobile-host[hidden] { display: none; }
  .unique-skill-owner { padding: 12px 16px 0; font-size: 12px; color: var(--text-muted); }
  .unique-skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px 16px; }
  .unique-skill-card {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: 8px;
  }
  .unique-skill-card.selected { background: rgba(201,162,39,.08); }
  .unique-skill-icon-wrapper {
    position: relative; width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg-tertiary); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .unique-skill-icon { width: 32px; height: 32px; border-radius: 50%; }
  .unique-skill-name {
    font-size: 10px; text-align: center; color: var(--text-secondary);
    max-width: 72px; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- Skill detail (shared: sidebar + modal) ---------- */
  .skill-detail-header { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .skill-detail-icon { width: 46px; height: 46px; border-radius: 8px; border: 1px solid var(--border); }
  .skill-detail-info h3 { margin: 0 0 2px; font-family: var(--font-display); font-size: 15px; color: var(--text-primary); }
  .skill-type { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
  .tooltip-subtitle { font-size: 12px; color: var(--gold-bright); font-family: var(--font-mono); margin-top: 2px; }
  .tooltip-subtitle.over-natural { color: var(--danger); }
  .skill-tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
  .skill-tag {
    font-size: 10.5px; padding: 2px 7px; border-radius: 10px;
    background: color-mix(in srgb, var(--tag-color, var(--gold-dim)) 22%, var(--bg-tertiary));
    color: var(--tag-color, var(--text-secondary));
    border: 1px solid color-mix(in srgb, var(--tag-color, var(--gold-dim)) 45%, transparent);
  }
  .skill-detail-section { margin-top: 12px; }
  .skill-detail-section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-muted); margin-bottom: 6px; font-weight: 600;
  }
  .skill-detail-desc, .tooltip-desc {
    font-size: 13px; line-height: 1.55; color: var(--text-secondary);
  }
  .skill-stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px;
    margin-top: 8px; font-size: 12px;
  }
  .stat-item { display: flex; justify-content: space-between; color: var(--text-secondary); }
  .stat-label { color: var(--text-muted); }
  .stat-value { font-family: var(--font-mono); color: var(--text-primary); }
  .skill-coeff-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12px; }
  .skill-coeff-table th, .skill-coeff-table td {
    padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--border-soft);
    font-family: var(--font-mono); color: var(--text-secondary);
  }
  .skill-coeff-table th:first-child, .skill-coeff-table td:first-child { text-align: left; font-family: var(--font-body); color: var(--text-muted); }
  .pvp-trend.up { color: var(--teal); }
  .pvp-trend.down { color: var(--danger); }
  .tooltip-prereqs { margin: 8px 0; }
  .tooltip-prereq.unmet { font-size: 12px; color: var(--danger); }
  .skill-next-level { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .next-level-header { font-size: 11px; text-transform: uppercase; color: var(--gold-bright); letter-spacing: .05em; margin-bottom: 4px; }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 100; width: 300px;
    background: var(--bg-elevated); border: 1px solid var(--gold-dim);
    border-radius: 10px; padding: 14px;
    box-shadow: 0 14px 32px rgba(0,0,0,.55);
    pointer-events: none;
  }
  #tooltip.hidden { display: none; }
  #tooltip:not(.visible) { display: none; }

  /* ---------- Modal ---------- */
  #skill-detail-modal {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(10,8,5,.6);
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  #skill-detail-modal.open { opacity: 1; pointer-events: auto; }
  .skill-detail-modal-sheet {
    width: 100%; max-width: 520px; max-height: 82vh; overflow-y: auto;
    background: var(--bg-secondary); border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 18px 18px 24px;
    transform: translateY(12px); transition: transform .15s ease;
  }
  #skill-detail-modal.open .skill-detail-modal-sheet { transform: translateY(0); }
  .skill-detail-modal-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }
  #skill-detail-modal-title { font-family: var(--font-display); font-size: 15px; margin: 0; }
  [data-skill-modal-close] {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--bg-tertiary); border: 1px solid var(--border);
    color: var(--text-secondary); font-size: 16px;
  }
  @media (min-width: 1372px) { #skill-detail-modal { display: none !important; } }

  footer.site-footer {
    text-align: center; padding: 24px; color: var(--text-muted); font-size: 11.5px;
    border-top: 1px solid var(--border-soft);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-mark">R</div>
  <div class="site-title">Skill Planner<small>Ragnarok Origin — Community Data</small></div>
</header>

<div class="toolbar">
  <span class="toolbar-label">Target Job</span>
  <div id="skill-planner-job-host"></div>
</div>

<div id="skill-planner-mobile-job-host"></div>
<div id="unique-skill-mobile-host" hidden></div>

<main class="simulator-layout">
  <div id="simulator-container">
    <div class="loading-state">Loading skills…</div>
  </div>

  <aside id="skill-planner-sidebar">
    <div class="sidebar-panel">
      <div class="sidebar-panel-title">Skill Details</div>
      <div id="skill-detail-content">
        <div class="details-placeholder">Select a skill to see details.</div>
      </div>
    </div>

    <div class="sidebar-panel" id="unique-skill-panel" hidden>
      <div class="sidebar-panel-title">Unique Skills</div>
      <div id="unique-skill-content"></div>
    </div>
  </aside>
</main>

<footer class="site-footer">Data sourced from the community rtnw-data project. Not affiliated with Gravity Co.</footer>

<!-- Shared job-select-shell markup: JS relocates this between job-host / mobile-job-host -->
<div class="job-select-shell">
  <select id="quick-job-select"></select>
  <button type="button" id="quick-job-select-button" aria-haspopup="listbox" aria-expanded="false">
    <span class="job-select-button-content">
      <img class="job-select-button-icon" alt="" hidden>
      <span class="job-select-button-label">Select a Target Job...</span>
    </span>
  </button>
  <div id="quick-job-select-popover" hidden>
    <ul id="quick-job-select-list" role="listbox" tabindex="-1"></ul>
  </div>
</div>

<!-- Tooltip -->
<div id="tooltip" class="hidden"></div>

<!-- Mobile / click-through skill detail modal -->
<div id="skill-detail-modal" aria-hidden="true" inert>
  <div class="skill-detail-modal-sheet">
    <div class="skill-detail-modal-header">
      <h3 id="skill-detail-modal-title">Skill Details</h3>
      <button type="button" data-skill-modal-close aria-label="Close">✕</button>
    </div>
    <div id="skill-detail-modal-content"></div>
  </div>
</div>

<script src="simulator.js"></script>
</body>
</html>
