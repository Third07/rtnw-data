<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RTNW — Skill Simulator (English)</title>

  <!-- Disable hard caching of this page -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Asset-version passthrough: appends a fresh timestamp to every asset/data URL
       so the browser can never serve a stale cached copy of the CSS/JS/JSON. -->
  <script>
    window.withAssetVersion = (function () {
      var v = Date.now();
      return function (s) {
        if (!s) return s;
        return s + (s.indexOf('?') > -1 ? '&' : '?') + 'v=' + v;
      };
    })();

    // Load the stylesheet through the same cache-busted URL instead of a
    // static <link>, so CSS edits always show up on reload.
    (function () {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = window.withAssetVersion('sea/skill-simulator/styles.css');
      document.head.appendChild(link);
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <img data-icon-name="icon_logo" class="header-logo" alt="logo">
        <div class="header-title">RTNW Skill Simulator — English</div>
      </div>

      <nav class="site-nav header-controls">
        <div class="page-toolbar">
          <div class="page-toolbar-slot job-select-shell">
            <!-- Button shown, native select kept for form value -->
            <button id="quick-job-select-button" class="job-select-button" aria-expanded="false" type="button">
              <div class="job-select-button-content">
                <img class="job-select-button-icon" alt="" hidden>
                <span class="job-select-button-label"></span>
              </div>
              <div class="job-select-button-caret"></div>
            </button>

            <select id="quick-job-select" class="job-select-native" aria-hidden="true"></select>

            <div id="quick-job-select-popover" class="job-select-popover" hidden>
              <ul id="quick-job-select-list" class="job-select-list"></ul>
            </div>
          </div>

          <div class="page-toolbar-slot">
            <button id="share-btn" class="header-share-btn">Share</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <div class="simulator-layout skill-planner-layout">
        <!-- Left / center / right layout — simulator will render into #simulator-container -->
        <div id="simulator-container" class="simulator-container"></div>

        <!-- Unique skills / details sidebars the script will populate -->
        <aside id="unique-skill-panel" class="unique-skill-panel" hidden>
          <div id="unique-skill-content"></div>
        </aside>

        <aside class="skill-detail-panel" id="skill-detail-panel">
          <div id="skill-detail-content" class="skill-details"></div>
        </aside>
      </div>
    </main>

    <!-- Modal and tooltip used by the simulator -->
    <div id="skill-detail-modal" class="skill-detail-modal" aria-hidden="true" inert>
      <div class="skill-detail-modal-dialog">
        <h3 id="skill-detail-modal-title">Skill Details</h3>
        <div id="skill-detail-modal-content"></div>
        <div style="padding:10px;text-align:right">
          <button data-skill-modal-close class="btn">Close</button>
        </div>
      </div>
    </div>

    <div id="tooltip" class="tooltip hidden"></div>
  </div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = window.withAssetVersion('sea/skill-simulator/simulator.js');
      s.defer = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
